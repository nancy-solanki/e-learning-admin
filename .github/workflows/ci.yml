name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn type-check

      - name: ESLint
        run: yarn lint

      - name: Prettier
        run: yarn format:check

      - name: Vitest
        run: yarn test

      - name: Install Playwright
        run: yarn playwright install --with-deps chromium

      - name: Playwright
        run: yarn test:e2e
